name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-type:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy types-PyYAML

      - name: Ruff check (evaluation scope)
        run: |
          ruff check code/rag/evaluation code/rag/evaluation_pipeline.py tests/unit/test_evaluation_quality.py

      - name: Mypy check (evaluation scope)
        run: |
          mypy --ignore-missing-imports code/rag/evaluation code/rag/evaluation_pipeline.py

  smoke-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run evaluation smoke test
        run: |
          python tests/smoke/test_evaluation_pipeline.py

      - name: Run evaluation unit quality tests
        run: |
          python tests/unit/test_evaluation_quality.py
