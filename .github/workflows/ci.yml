name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-type:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy types-PyYAML

      - name: Ruff check (task_v2 scope)
        run: |
          ruff check code/rag/task_v2 code/rag/task_v2_pipeline.py tests/unit/test_task_v2_quality.py

      - name: Mypy check (task_v2 scope)
        run: |
          mypy --ignore-missing-imports code/rag/task_v2 code/rag/task_v2_pipeline.py

  smoke-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run task-v2 smoke test
        run: |
          python tests/smoke/test_task_v2_pipeline.py

      - name: Run task-v2 unit quality tests
        run: |
          python tests/unit/test_task_v2_quality.py
