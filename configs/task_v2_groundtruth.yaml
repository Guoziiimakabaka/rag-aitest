experiment:
  name: task-v2-groundtruth
  seed: 42
  baseline_variant: full
  output_dir: code/rag/reports/task_v2/groundtruth

benchmark:
  question_type_path: code/rag/outputs/generated_testset.json

variants:
  - name: full
    eval_json: code/rag/outputs/large/rag_eval_results.json
    switches:
      use_hybrid: true
      use_reranker: true
      use_reflection: true
      use_query_rewrite: true

  - name: chunk200_baseline
    eval_json: code/rag/outputs/small/rag_eval_results.json
    switches:
      use_hybrid: false
      use_reranker: false
      use_reflection: false
      use_query_rewrite: false

calibration:
  bins: 10
  refusal_threshold: 0.65
  correctness_mode: ground_truth_contains
  correct_proxy_faithfulness_min: 0.8
  correct_proxy_relevance_min: 0.8
  confidence_weights:
    context_recall: 0.1
    context_precision: 0.2
    faithfulness: 0.4
    answer_relevance: 0.3
  threshold_sweep:
    start: 0.40
    end: 0.90
    step: 0.05
    lambda_refusal: 0.2
    lambda_leak: 0.3

decision_gate:
  compare_variants: []
  metric_minimums:
    context_recall: 0.45
    context_precision: 0.50
    faithfulness: 0.90
    answer_relevance: 0.85
  require_significant_improvement_metrics:
    - faithfulness
  max_ece: 0.25
  min_accepted_accuracy_proxy: 0.85
  max_error_leakage_rate_after_accept: 0.20

competition_scorecard:
  readiness_threshold: 0.85
  default_score_weight: 5.0
  rule_mapping: {}
