experiment:
  name: task-v2
  seed: 42
  baseline_variant: full
  output_dir: code/rag/reports/task_v2/latest

statistics:
  bootstrap_iters: 1500
  p_alpha: 0.05
  p_adjust_method: holm

decision_gate:
  use_adjusted_significance: true
  require_positive_mean_diff: true
  min_significant_metrics: 1
  max_stability_std: 0.015
  max_stability_cv: 0.05
  max_avg_latency_multiplier: 1.25
  max_latency_multiplier: 1.35
  min_mean_context_recall_gain: 0.0
  min_mean_answer_relevance_gain: 0.0

benchmark:
  question_type_path: code/rag/outputs/generated_testset.json

variants:
  - name: full
    eval_json: code/rag/outputs/large/rag_eval_results.json
    # Optional repeated-run input for Week-2 stability analysis.
    # When set, run_real_ablation loads all paths in eval_json_runs.
    # eval_json_runs:
    #   - code/rag/outputs/large/rag_eval_results_run1.json
    #   - code/rag/outputs/large/rag_eval_results_run2.json
    #   - code/rag/outputs/large/rag_eval_results_run3.json
    switches:
      use_hybrid: true
      use_reranker: true
      use_reflection: true
      use_query_rewrite: true

  - name: chunk200_baseline
    eval_json: code/rag/outputs/small/rag_eval_results.json
    switches:
      use_hybrid: false
      use_reranker: false
      use_reflection: false
      use_query_rewrite: false
